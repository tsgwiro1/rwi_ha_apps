name: "CM4 System Monitor"
description: "Überwachung für Waveshare CM4-POE-UPS-BASE Board (Lüfter & USV) über I2C"
version: "2.1.0"
slug: "cm4_sys_monitor"
url: "https://github.com/tsgwiro1/rwi_ha_apps/tree/main/cm4_sys_monitor"
init: false
arch:
  - aarch64
startup: services
devices:
  - /dev/i2c-10
schema:
  hostname: str
  port: int
  username: str
  password: str
  interval: int
  devicename: str
  clientid: "str?"
  fanmintemp: int
  fanmaxtemp: int
  bat_v: bool
  bat_percent: bool
  bat_curr: bool
  fan_speed: bool
  log_level: list(info|debug|warning|error)
  fan_hysteresis: float(0.5,10.0)
options:
  port: 1883
  interval: 60
  devicename: cm4_sys_mon
  fanmintemp: 45
  fanmaxtemp: 60
  bat_v: true
  bat_percent: true
  bat_curr: true
  fan_speed: true
  log_level: "info"
  fan_hysteresis: 2.0
